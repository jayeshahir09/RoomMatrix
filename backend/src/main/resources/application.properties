spring.application.name=backend

# Database connection Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.profiles.active=${activeProfile}

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

# WhatsApp OTP Configuration (Meta WhatsApp Cloud API / Console Mock)
whatsapp.provider=${WHATSAPP_PROVIDER:console}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:roommatrix_otp_verification}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
whatsapp.language-code=${WHATSAPP_LANGUAGE_CODE:en_US}
whatsapp.include-button=${WHATSAPP_INCLUDE_BUTTON:false}
